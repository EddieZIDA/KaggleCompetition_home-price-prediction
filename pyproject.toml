[project]
name = "home-price-prediction"
version = "2.0.0"
description = "Kaggle House Prices: leak-free scikit-learn pipeline with a tuned, honestly-evaluated ensemble"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: needs the Kaggle CSV files in data/raw (skipped otherwise)"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
